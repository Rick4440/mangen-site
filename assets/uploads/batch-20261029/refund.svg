<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img">
<title>日本退税新制 · 两步别混淆。原创流程示意，非实景照片与地图。</title>
<rect width="1600" height="1000" fill="#f5f1e7"/>
<rect x="80" y="80" width="68" height="8" fill="#a57435"/>
<text x="80" y="158" fill="#173f3b" font-size="48" font-weight="700" font-family="Noto Sans CJK SC">日本退税新制 · 两步别混淆</text>
<text x="82" y="220" fill="#5d6964" font-size="27" font-family="Noto Sans CJK SC">2026 旅行准备  /  核验日期：10月31日</text>
<rect x="80" y="300" width="460" height="400" rx="24" fill="#ffffff"/>
<circle cx="135" cy="360" r="25" fill="#173f3b"/>
<text x="127" y="370" fill="white" font-size="26" font-family="sans-serif">1</text>
<text x="115" y="445" fill="#a57435" font-size="35" font-family="Noto Sans CJK SC">购物时</text>
<text x="115" y="525" fill="#173f3b" font-size="29" font-family="Noto Sans CJK SC">先付含税价格</text>
<text x="115" y="600" fill="#5d6964" font-size="24" font-family="Noto Sans CJK SC">2026年11月1日起</text>
<rect x="570" y="300" width="460" height="400" rx="24" fill="#ffffff"/>
<circle cx="625" cy="360" r="25" fill="#173f3b"/>
<text x="617" y="370" fill="white" font-size="26" font-family="sans-serif">2</text>
<text x="605" y="445" fill="#a57435" font-size="35" font-family="Noto Sans CJK SC">出境时</text>
<text x="605" y="525" fill="#173f3b" font-size="29" font-family="Noto Sans CJK SC">海关确认携带商品</text>
<text x="605" y="600" fill="#5d6964" font-size="24" font-family="Noto Sans CJK SC">托运之前完成确认</text>
<rect x="1060" y="300" width="460" height="400" rx="24" fill="#ffffff"/>
<circle cx="1115" cy="360" r="25" fill="#173f3b"/>
<text x="1107" y="370" fill="white" font-size="26" font-family="sans-serif">3</text>
<text x="1095" y="445" fill="#a57435" font-size="35" font-family="Noto Sans CJK SC">确认后</text>
<text x="1095" y="525" fill="#173f3b" font-size="29" font-family="Noto Sans CJK SC">按店家渠道退款</text>
<text x="1095" y="600" fill="#5d6964" font-size="24" font-family="Noto Sans CJK SC">现金机不等于海关终端</text>
<path d="M80 780H1520" stroke="#cbd4cb" stroke-width="2"/>
<text x="80" y="845" fill="#173f3b" font-size="28" font-family="Noto Sans CJK SC">先看适用日期，再安排行程；具体票务与运营条件见正文。</text>
<text x="80" y="914" fill="#6f776f" font-size="22" font-family="Noto Sans CJK SC">万源原创示意  ·  非实拍 / 非地图  ·  不代表实时运营状况</text>
</svg>