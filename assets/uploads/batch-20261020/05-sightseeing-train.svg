<title id="title">观光列车｜把风景留给车窗</title><desc id="desc">观光列车概念示意图：一节青绿与金色的虚构车厢有三扇大窗，窗内以树绿山形、金色太阳和浅青天空象征车窗风景，上方悬着写有“指定席”的票券，下方有两组双轮转向架及车钩。右侧提示核对运营日期、席位预约及上车换乘；车厢不代表实际车型，风景与票券不对应具体线路、座位或服务。</desc><metadata>万源文章原创图示（AI辅助）。项目原创图示；未使用第三方图片素材。All objects are original symbolic vector drawings, not photographs, accurate landmark elevations, maps, geographic positioning, routes or distance claims. Editable SVG text uses locally installed Noto Sans CJK SC; no font embedded.</metadata>
