<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">秋田｜绿意、灯影与老建筑</title><desc id="desc">秋田旅行概念图以三个独立原创场景表现公园停留、竿灯文化与老建筑参观：树木、长椅和步道；杆架上排列的多盏金色灯笼；带砖纹、窗户和拱形入口的通用红砖历史建筑符号。灯架不复原特定竿灯形制或保证能看到祭典，红砖建筑也不是赤砖乡土馆真实立面的复原；图中不表示路线、距离或方位。</desc><metadata>万源文章原创图示（AI辅助）。项目原创图示；未使用第三方图片素材。All objects are original symbolic vector drawings, not photographs, accurate landmark elevations, maps, geographic positioning, routes or distance claims. Editable SVG text uses locally installed Noto Sans CJK SC; no font embedded.</metadata>
