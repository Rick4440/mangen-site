<title id="title">山形｜石垣、老建筑与城市散步</title><desc id="desc">山形旅行概念图用三个独立画框表现城址公园、历史建筑和市区散步：低矮石垣后有树木，象征城址绿地；一座对称门窗的原创历史风格建筑，象征历史空间；简化街屋之间的足迹，象征城市步行。所有建筑和石垣均非特定山形地标的真实复原，不表示历史建筑楼层、地理方位、路线或距离。</desc><metadata>万源文章原创图示（AI辅助）。项目原创图示；未使用第三方图片素材。All objects are original symbolic vector drawings, not photographs, accurate landmark elevations, maps, geographic positioning, routes or distance claims. Editable SVG text uses locally installed Noto Sans CJK SC; no font embedded.</metadata>
