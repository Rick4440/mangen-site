<title id="title">松江｜城、旧街与水上时光</title><desc id="desc">松江旅行概念图用三个独立画框表现城郭参观、盐见绳手城下町慢走与护城河游船：左框是原创抽象日式城郭与石基，中框是三幢传统风格街屋，右框是带遮棚的小船、乘客与水纹。三个图像均为主题符号，不复原松江城、盐见绳手街屋或游船的真实外观，也不表示路线、距离、方位或推荐先后顺序。</desc><metadata>万源文章原创图示（AI辅助）。项目原创图示；未使用第三方图片素材。All objects are original symbolic vector drawings, not photographs, accurate landmark elevations, maps, geographic positioning, routes or distance claims. Editable SVG text uses locally installed Noto Sans CJK SC; no font embedded.</metadata>
