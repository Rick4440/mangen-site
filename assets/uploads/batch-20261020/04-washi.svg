<title id="title">和纸体验｜把纤维抄成纸</title><desc id="desc">和纸制作概念示意图：大纸浆槽上方斜举着木框抄纸帘，帘内可见网格与湿纤维的象征线条，下方有水滴；右侧独立晾架夹着两张待干纸页。准备提示为核对体验、按指导使用工具、问清干燥与取件安排。画面为抽象工艺概念，不承诺特定工坊的设备或制作流程。</desc><metadata>万源文章原创图示（AI辅助）。项目原创图示；未使用第三方图片素材。All objects are original symbolic vector drawings, not photographs, accurate landmark elevations, maps, geographic positioning, routes or distance claims. Editable SVG text uses locally installed Noto Sans CJK SC; no font embedded.</metadata>
