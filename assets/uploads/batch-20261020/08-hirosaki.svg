<title id="title">弘前｜公园、旧街与苹果小歇</title><desc id="desc">弘前旅行概念图的三个独立画框分别是有树木、长椅与步道的公园，三幢原创的传统风格街屋，以及一颗带叶苹果和一杯热饮，表示公园散步、旧街漫游与苹果主题休息。图中没有樱花花期承诺或真实公园、建筑、店铺的外观复原；三框不构成地图或实际游览路线。</desc><metadata>万源文章原创图示（AI辅助）。项目原创图示；未使用第三方图片素材。All objects are original symbolic vector drawings, not photographs, accurate landmark elevations, maps, geographic positioning, routes or distance claims. Editable SVG text uses locally installed Noto Sans CJK SC; no font embedded.</metadata>
