<title id="title">动物园｜给观察留点时间</title><desc id="desc">动物园概念示意图：一只长颈鹿站在抽象树木与绿植之间，左下是双筒望远镜观察卡，右下有休息长椅。右侧以票券、望远镜和时钟提示确认门票、保持距离安静观察及安排休息。图中未表示真实园区、动物展区位置或任何特定动物园。</desc><metadata>万源文章原创图示（AI辅助）。项目原创图示；未使用第三方图片素材。All objects are original symbolic vector drawings, not photographs, accurate landmark elevations, maps, geographic positioning, routes or distance claims. Editable SVG text uses locally installed Noto Sans CJK SC; no font embedded.</metadata>
