<title id="title">高知｜从城山走进街市</title><desc id="desc">高知旅行概念图分为三个独立主题：抽象日式城郭立在绿色小丘上，表示城山参观；带条纹顶棚的市集摊位前有一碗午餐，表示市场用餐；两幢简化街屋之间排列足迹，表示市区慢走。建筑、地形和食物均为原创象征图形，不对应高知具体地标外观、店铺、街道位置或步行距离。</desc><metadata>万源文章原创图示（AI辅助）。项目原创图示；未使用第三方图片素材。All objects are original symbolic vector drawings, not photographs, accurate landmark elevations, maps, geographic positioning, routes or distance claims. Editable SVG text uses locally installed Noto Sans CJK SC; no font embedded.</metadata>
