<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">天文馆｜抬头看星空</title><desc id="desc">深蓝色半球形天象厅里，星点、星座连线与投影仪光束位于座椅上方；右侧以票券、时钟和手机提示选节目、提前到场及收起亮屏。</desc><metadata>Original AI-assisted vector artwork created for Mangen. No third-party images, photographs, logos, or visual asset files used. Prepared for reproduction and adaptation in the Mangen project; no claim of exclusive rights in AI-generated elements. Chinese typography: locally installed Noto Sans CJK SC.</metadata><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#F5F0E6" stroke="none" stroke-width="0"/><rect x="72" y="61" width="9" height="30" rx="4" fill="#267A78" stroke="none" stroke-width="0"/><text id="text-4" x="101" y="85" font-family="Noto Sans CJK SC" font-size="23" font-weight="500" fill="#267A78" text-anchor="start" letter-spacing="2">MANGEN  /  旅前准备</text><text id="text-5" x="1528" y="85" font-family="Noto Sans CJK SC" font-size="23" font-weight="500" fill="#267A78" text-anchor="end" letter-spacing="0">02</text><text id="text-6" x="72" y="171" font-family="Noto Sans CJK SC" font-size="58" font-weight="700" fill="#16394A" text-anchor="start" letter-spacing="0">天文馆｜抬头看星空</text><text id="text-7" x="75" y="225" font-family="Noto Sans CJK SC" font-size="25" font-weight="400" fill="#536B70" text-anchor="start" letter-spacing="0">先选适合的节目，入场后给黑暗一点时间</text><path d="M72 905L1528 905" fill="none" stroke="#C9D4CB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text id="text-9" x="72" y="954" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" fill="#536B70" text-anchor="start" letter-spacing="0">原创示意・非实景</text><text id="text-10" x="1528" y="954" font-family="Noto Sans CJK SC" font-size="19" font-weight="500" fill="#536B70" text-anchor="end" letter-spacing="2">MANGEN  TRAVEL NOTES</text><ellipse cx="550" cy="794" rx="385" ry="35" fill="#D8DED1" stroke="none" stroke-width="0"/><pa