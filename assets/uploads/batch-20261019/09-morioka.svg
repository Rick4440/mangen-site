<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">盛冈｜把散步留给河与街</title><desc id="desc">盛冈建议行程概念图：石垣与树木、盛有面条的碗、桥与河水依次连接，表示城迹石垣、面食午餐、中津川三个阶段；虚线仅表达建议顺序，不表示真实距离或路线。</desc><metadata>Original AI-assisted vector artwork created for Mangen. No third-party images, photographs, logos, or visual asset files used. Prepared for reproduction and adaptation in the Mangen project; no claim of exclusive rights in AI-generated elements. Chinese typography: locally installed Noto Sans CJK SC.</metadata><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#F5F0E6" stroke="none" stroke-width="0"/><rect x="72" y="61" width="9" height="30" rx="4" fill="#267A78" stroke="none" stroke-width="0"/><text id="text-4" x="101" y="85" font-family="Noto Sans CJK SC" font-size="23" font-weight="500" fill="#267A78" text-anchor="start" letter-spacing="2">MANGEN  /  城市慢行</text><text id="text-5" x="1528" y="85" font-family="Noto Sans CJK SC" font-size="23" font-weight="500" fill="#267A78" text-anchor="end" letter-spacing="0">09</text><text id="text-6" x="72" y="171" font-family="Noto Sans CJK SC" font-size="58" font-weight="700" fill="#16394A" text-anchor="start" letter-spacing="0">盛冈｜把散步留给河与街</text><text id="text-7" x="75" y="225" font-family="Noto Sans CJK SC" font-size="25" font-weight="400" fill="#536B70" text-anchor="start" letter-spacing="0">看石垣，吃一碗面，再把脚步交给河岸</text><path d="M72 905L1528 905" fill="none" stroke="#C9D4CB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text id="text-9" x="72" y="954" font-family="Noto Sans CJK SC" font-size="24" font-weight="400" fill="#536B70" text-anchor="start" letter-spacing="0">原创示意・非实景</text><text id="text-10" x="1528" y="954" font-family="Noto Sans CJK SC" font-size="19" font-weight="500" fill="#536B70" text-anchor="end" letter-spacing="2">MANGEN  TRAVEL NOTES</text><rect x="1115" y="191" width="413" height="44" rx="22" fill="#FFFDF7" stroke