<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img">
<title>热海烟花：看完怎样回酒店；万源原创示意图，非实拍、非地图</title>
<rect width="1600" height="1100" fill="#f6f3ec"/>
<rect x="70" y="70" width="65" height="8" fill="#94652f"/>
<text x="70" y="165" fill="#234a46" font-size="60" font-weight="700" font-family="Noto Sans CJK SC">热海烟花：看完怎样回酒店</text>
<text x="70" y="225" fill="#6b7472" font-size="32" font-weight="400" font-family="Noto Sans CJK SC">2026旅行准备  ·  核验日期10月31日</text>
<rect x="70" y="285" width="710" height="280" rx="18" fill="white"/>
<text x="102" y="350" fill="#94652f" font-size="43" font-weight="700" font-family="Noto Sans CJK SC">01  核对场次</text>
<text x="102" y="425" fill="#234a46" font-size="38" font-weight="400" font-family="Noto Sans CJK SC">以2026官方日期为准</text>
<text x="102" y="488" fill="#234a46" font-size="38" font-weight="400" font-family="Noto Sans CJK SC">天气可能改变实施安排</text>
<rect x="830" y="285" width="710" height="280" rx="18" fill="white"/>
<text x="862" y="350" fill="#94652f" font-size="43" font-weight="700" font-family="Noto Sans CJK SC">02  倒推返程</text>
<text x="862" y="425" fill="#234a46" font-size="38" font-weight="400" font-family="Noto Sans CJK SC">先选可用列车再选位置</text>
<text x="862" y="488" fill="#234a46" font-size="38" font-weight="400" font-family="Noto Sans CJK SC">不要只算烟花结束时刻</text>
<rect x="70" y="600" width="710" height="280" rx="18" fill="white"/>
<text x="102" y="665" fill="#94652f" font-size="43" font-weight="700" font-family="Noto Sans CJK SC">03  计算步行</text>
<text x="102" y="740" fill="#234a46" font-size="38" font-weight="400" font-family="Noto Sans CJK SC">海边到车站还需上坡</text>
<text x="102" y="803" fill="#234a46" font-size="38" font-weight="400" font-family="Noto Sans CJK SC">散场人流另留时间</text>
<rect x="830" y="600" width="710" height="280" rx="18" fill="white"/>
<text x="862" y="665" fill="#94652f" font-size="43" font-weight="700" font-family="Noto Sans CJK SC">04  决定留宿</text>
<text x="862" y="740" fill="#234a46" font-size="38" font-weight="400" font-family="Noto Sans CJK SC">带孩子或不想赶车</text>
<text x="862" y="803" fill="#234a46" font-size="38" font-weight="400" font-family="Noto Sans CJK SC">可比较热海住一晚方案</text>
<text x="70" y="995" fill="#234a46" font-size="31" font-weight="400" font-family="Noto Sans CJK SC">适用条件及官方来源见正文；出发前复核最新公告。</text>
<text x="70" y="1055" fill="#6b7472" font-size="26" font-weight="400" font-family="Noto Sans CJK SC">万源原创信息图 · 非实拍 / 非地图 · 不代表实时状态或个案确认</text>
</svg>