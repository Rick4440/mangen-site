<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img">
<title>辅助犬赴日：手续分开核对；万源原创示意图，非实拍、非地图</title>
<rect width="1600" height="1100" fill="#f6f3ec"/>
<rect x="70" y="70" width="65" height="8" fill="#39738a"/>
<text x="70" y="165" fill="#243e54" font-size="60" font-weight="700" font-family="Noto Sans CJK SC">辅助犬赴日：手续分开核对</text>
<text x="70" y="225" fill="#6b7472" font-size="32" font-weight="400" font-family="Noto Sans CJK SC">2026旅行准备  ·  核验日期10月31日</text>
<rect x="70" y="285" width="710" height="280" rx="18" fill="white"/>
<text x="102" y="350" fill="#39738a" font-size="43" font-weight="700" font-family="Noto Sans CJK SC">01  辅助犬资格</text>
<text x="102" y="425" fill="#243e54" font-size="38" font-weight="400" font-family="Noto Sans CJK SC">核对日本临时证明要求</text>
<text x="102" y="488" fill="#243e54" font-size="38" font-weight="400" font-family="Noto Sans CJK SC">海外证书不自动替代</text>
<rect x="830" y="285" width="710" height="280" rx="18" fill="white"/>
<text x="862" y="350" fill="#39738a" font-size="43" font-weight="700" font-family="Noto Sans CJK SC">02  动物检疫</text>
<text x="862" y="425" fill="#243e54" font-size="38" font-weight="400" font-family="Noto Sans CJK SC">疫苗、证明和抵达申报</text>
<text x="862" y="488" fill="#243e54" font-size="38" font-weight="400" font-family="Noto Sans CJK SC">与辅助犬资格分别办理</text>
<rect x="70" y="600" width="710" height="280" rx="18" fill="white"/>
<text x="102" y="665" fill="#39738a" font-size="43" font-weight="700" font-family="Noto Sans CJK SC">03  联系交通</text>
<text x="102" y="740" fill="#243e54" font-size="38" font-weight="400" font-family="Noto Sans CJK SC">航空公司规则另行确认</text>
<text x="102" y="803" fill="#243e54" font-size="38" font-weight="400" font-family="Noto Sans CJK SC">不要临到登机再询问</text>
<rect x="830" y="600" width="710" height="280" rx="18" fill="white"/>
<text x="862" y="665" fill="#39738a" font-size="43" font-weight="700" font-family="Noto Sans CJK SC">04  安排接待</text>
<text x="862" y="740" fill="#243e54" font-size="38" font-weight="400" font-family="Noto Sans CJK SC">将需求告知住宿和目的地</text>
<text x="862" y="803" fill="#243e54" font-size="38" font-weight="400" font-family="Noto Sans CJK SC">随身保存必要文件</text>
<text x="70" y="995" fill="#243e54" font-size="31" font-weight="400" font-family="Noto Sans CJK SC">适用条件及官方来源见正文；出发前复核最新公告。</text>
<text x="70" y="1055" fill="#6b7472" font-size="26" font-weight="400" font-family="Noto Sans CJK SC">万源原创信息图 · 非实拍 / 非地图 · 不代表实时状态或个案确认</text>
</svg>