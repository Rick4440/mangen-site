<rect x="830" y="600" width="710" height="280" rx="18" fill="white"/>
<text x="862" y="665" fill="#94652f" font-size="43" font-weight="700" font-family="Noto Sans CJK SC">04  设置备选</text>
<text x="862" y="740" fill="#234a46" font-size="38" font-weight="400" font-family="Noto Sans CJK SC">住宿与远程接续留弹性</text>
<text x="862" y="803" fill="#234a46" font-size="38" font-weight="400" font-family="Noto Sans CJK SC">停运时不冒险强行上山</text>
<text x="70" y="995" fill="#234a46" font-size="31" font-weight="400" font-family="Noto Sans CJK SC">适用条件及官方来源见正文；出发前复核最新公告。</text>
<text x="70" y="1055" fill="#6b7472" font-size="26" font-weight="400" font-family="Noto Sans CJK SC">万源原创信息图 · 非实拍 / 非地图 · 不代表实时状态或个案确认</text>
