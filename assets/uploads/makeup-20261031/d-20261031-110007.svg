<text x="70" y="165" fill="#234a46" font-size="60" font-weight="700" font-family="Noto Sans CJK SC">立山黑部：11月先看能否走</text>
<text x="70" y="225" fill="#6b7472" font-size="32" font-weight="400" font-family="Noto Sans CJK SC">2026旅行准备  ·  核验日期10月31日</text>
<rect x="70" y="285" width="710" height="280" rx="18" fill="white"/>
<text x="102" y="350" fill="#94652f" font-size="43" font-weight="700" font-family="Noto Sans CJK SC">01  分清线路</text>
<text x="102" y="425" fill="#234a46" font-size="38" font-weight="400" font-family="Noto Sans CJK SC">阿尔卑斯路线与峡谷铁道</text>
<text x="102" y="488" fill="#234a46" font-size="38" font-weight="400" font-family="Noto Sans CJK SC">不是同一条观光路线</text>
<rect x="830" y="285" width="710" height="280" rx="18" fill="white"/>
<text x="862" y="350" fill="#94652f" font-size="43" font-weight="700" font-family="Noto Sans CJK SC">02  核对季末</text>
<text x="862" y="425" fill="#234a46" font-size="38" font-weight="400" font-family="Noto Sans CJK SC">查今年营业期和时刻</text>
<text x="862" y="488" fill="#234a46" font-size="38" font-weight="400" font-family="Noto Sans CJK SC">不沿用夏季班次计划</text>
<rect x="70" y="600" width="710" height="280" rx="18" fill="white"/>
