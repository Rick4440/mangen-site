<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img">
<title>从日本寄包裹：先核物品再包装；万源原创示意图，非实拍、非地图</title>
<rect width="1600" height="1100" fill="#f6f3ec"/>
<rect x="70" y="70" width="65" height="8" fill="#39738a"/>
<text x="70" y="165" fill="#243e54" font-size="60" font-weight="700" font-family="Noto Sans CJK SC">从日本寄包裹：先核物品再包装</text>
<text x="70" y="225" fill="#6b7472" font-size="32" font-weight="400" font-family="Noto Sans CJK SC">2026旅行准备  ·  核验日期10月31日</text>
<rect x="70" y="285" width="710" height="280" rx="18" fill="white"/>
<text x="102" y="350" fill="#39738a" font-size="43" font-weight="700" font-family="Noto Sans CJK SC">01  检查内容</text>
<text x="102" y="425" fill="#243e54" font-size="38" font-weight="400" font-family="Noto Sans CJK SC">确认禁寄品和目的地规则</text>
<text x="102" y="488" fill="#243e54" font-size="38" font-weight="400" font-family="Noto Sans CJK SC">食品、电池等分别查询</text>
<rect x="830" y="285" width="710" height="280" rx="18" fill="white"/>
<text x="862" y="350" fill="#39738a" font-size="43" font-weight="700" font-family="Noto Sans CJK SC">02  选择服务</text>
<text x="862" y="425" fill="#243e54" font-size="38" font-weight="400" font-family="Noto Sans CJK SC">核对目的地是否受理</text>
<text x="862" y="488" fill="#243e54" font-size="38" font-weight="400" font-family="Noto Sans CJK SC">尺寸重量影响可选服务</text>
<rect x="70" y="600" width="710" height="280" rx="18" fill="white"/>
<text x="102" y="665" fill="#39738a" font-size="43" font-weight="700" font-family="Noto Sans CJK SC">03  填写申报</text>
<text x="102" y="740" fill="#243e54" font-size="38" font-weight="400" font-family="Noto Sans CJK SC">如实填写品名、数量价值</text>
<text x="102" y="803" fill="#243e54" font-size="38" font-weight="400" font-family="Noto Sans CJK SC">不要笼统写成礼物</text>
<rect x="830" y="600" width="710" height="280" rx="18" fill="white"/>
<text x="862" y="665" fill="#39738a" font-size="43" font-weight="700" font-family="Noto Sans CJK SC">04  保留记录</text>
<text x="862" y="740" fill="#243e54" font-size="38" font-weight="400" font-family="Noto Sans CJK SC">保存收据和追踪信息</text>
<text x="862" y="803" fill="#243e54" font-size="38" font-weight="400" font-family="Noto Sans CJK SC">时效与税费不能保证</text>
<text x="70" y="995" fill="#243e54" font-size="31" font-weight="400" font-family="Noto Sans CJK SC">适用条件及官方来源见正文；出发前复核最新公告。</text>
<text x="70" y="1055" fill="#6b7472" font-size="26" font-weight="400" font-family="Noto Sans CJK SC">万源原创信息图 · 非实拍 / 非地图 · 不代表实时状态或个案确认</text>
