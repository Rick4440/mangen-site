<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img">
<title>旅行保险：出险资料分开留；万源原创示意图，非实拍、非地图</title>
<rect width="1600" height="1100" fill="#f6f3ec"/>
<rect x="70" y="70" width="65" height="8" fill="#39738a"/>
<text x="70" y="165" fill="#243e54" font-size="60" font-weight="700" font-family="Noto Sans CJK SC">旅行保险：出险资料分开留</text>
<text x="70" y="225" fill="#6b7472" font-size="32" font-weight="400" font-family="Noto Sans CJK SC">2026旅行准备  ·  核验日期10月31日</text>
<rect x="70" y="285" width="710" height="280" rx="18" fill="white"/>
<text x="102" y="350" fill="#39738a" font-size="43" font-weight="700" font-family="Noto Sans CJK SC">01  先保安全</text>
<text x="102" y="425" fill="#243e54" font-size="38" font-weight="400" font-family="Noto Sans CJK SC">紧急事项先求助</text>
<text x="102" y="488" fill="#243e54" font-size="38" font-weight="400" font-family="Noto Sans CJK SC">别为找保单耽误处置</text>
<rect x="830" y="285" width="710" height="280" rx="18" fill="white"/>
<text x="862" y="350" fill="#39738a" font-size="43" font-weight="700" font-family="Noto Sans CJK SC">02  联系保险方</text>
<text x="862" y="425" fill="#243e54" font-size="38" font-weight="400" font-family="Noto Sans CJK SC">报案并确认所需资料</text>
<text x="862" y="488" fill="#243e54" font-size="38" font-weight="400" font-family="Noto Sans CJK SC">期限和流程按合同办理</text>
<rect x="70" y="600" width="710" height="280" rx="18" fill="white"/>
<text x="102" y="665" fill="#39738a" font-size="43" font-weight="700" font-family="Noto Sans CJK SC">03  分项留证</text>
<text x="102" y="740" fill="#243e54" font-size="38" font-weight="400" font-family="Noto Sans CJK SC">就医、延误、财物损失</text>
<text x="102" y="803" fill="#243e54" font-size="38" font-weight="400" font-family="Noto Sans CJK SC">需要的凭证各不相同</text>
<rect x="830" y="600" width="710" height="280" rx="18" fill="white"/>
<text x="862" y="665" fill="#39738a" font-size="43" font-weight="700" font-family="Noto Sans CJK SC">04  如实申请</text>
<text x="862" y="740" fill="#243e54" font-size="38" font-weight="400" font-family="Noto Sans CJK SC">提交实际费用与经过</text>
<text x="862" y="803" fill="#243e54" font-size="38" font-weight="400" font-family="Noto Sans CJK SC">备齐资料不等于必然赔付</text>
<text x="70" y="995" fill="#243e54" font-size="31" font-weight="400" font-family="Noto Sans CJK SC">适用条件及官方来源见正文；出发前复核最新公告。</text>
<text x="70" y="1055" fill="#6b7472" font-size="26" font-weight="400" font-family="Noto Sans CJK SC">万源原创信息图 · 非实拍 / 非地图 · 不代表实时状态或个案确认</text>
</svg>