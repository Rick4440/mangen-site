<text x="90" y="184" font-family="Noto Sans CJK SC" font-size="48" font-weight="700" fill="#604432">直岛：按馆名排，不按岛名猜</text>
<text x="90" y="248" font-family="Noto Sans CJK SC" font-size="27" font-weight="400" fill="#68716e">先确认条件，再安排出行。核验日期：2026年10月31日</text>
<rect x="90" y="322" width="1420" height="130" rx="12" fill="white"/>
