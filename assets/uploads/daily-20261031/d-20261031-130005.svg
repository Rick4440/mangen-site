<circle cx="155" cy="697" r="28" fill="#9e6250"/>
<text x="145" y="707" font-family="Noto Sans CJK SC" font-size="27" font-weight="700" fill="white">3</text>
<text x="215" y="692" font-family="Noto Sans CJK SC" font-size="33" font-weight="700" fill="#9e6250">最后排船</text>
<text x="550" y="692" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#604432">到港之后仍需移动</text>
<text x="550" y="735" font-family="Noto Sans CJK SC" font-size="27" font-weight="400" fill="#626a68">往返船班都留缓冲</text>
