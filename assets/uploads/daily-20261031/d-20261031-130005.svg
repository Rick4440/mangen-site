<text x="215" y="382" font-family="Noto Sans CJK SC" font-size="33" font-weight="700" fill="#9e6250">先查馆名</text>
<text x="550" y="382" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#604432">逐馆核对休馆期</text>
<text x="550" y="425" font-family="Noto Sans CJK SC" font-size="27" font-weight="400" fill="#626a68">新美术馆与地中分别看</text>
<rect x="90" y="477" width="1420" height="130" rx="12" fill="white"/>
<circle cx="155" cy="542" r="28" fill="#9e6250"/>
<text x="145" y="552" font-family="Noto Sans CJK SC" font-size="27" font-weight="700" fill="white">2</text>
<text x="215" y="537" font-family="Noto Sans CJK SC" font-size="33" font-weight="700" fill="#9e6250">再订时段</text>
<text x="550" y="537" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#604432">免费儿童也计人数</text>
<text x="550" y="580" font-family="Noto Sans CJK SC" font-size="27" font-weight="400" fill="#626a68">共通票覆盖范围另核对</text>
