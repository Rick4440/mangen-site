<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc"><title id="title">日本住宿 · 护照</title><desc id="desc">日本游客护照原创流程示意：游客带原件，酒店核验复印，办理后取回原件。 原创矢量示意，非实拍。重要文字和图形位于中心750×650安全区。</desc><rect x="0" y="0" width="1200" height="750" fill="#EEF2E8" rx="0"/><circle cx="50" cy="15" r="290" fill="#306E63" opacity=".11"/><circle cx="1170" cy="690" r="330" fill="#306E63" opacity=".10"/><path d="M-40 639 Q230 489 405 637 T880 614 T1250 640" fill="none" opacity=".20" stroke="#306E63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-80 673 Q180 533 405 670 T880 648 T1270 674" fill="none" opacity=".13" stroke="#306E63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="100" cy="300" r="7" fill="#306E63" opacity=".22"/><circle cx="1090" cy="210" r="7" fill="#306E63" opacity=".22"/><circle cx="155" cy="600" r="7" fill="#306E63" opacity=".22"/><circle cx="1060" cy="563" r="7" fill="#306E63" opacity=".22"/><text x="600" y="96" font-family="Noto Sans CJK SC" font-size="25" font-weight="600" fill="#306E63" text-anchor="middle" letter-spacing="5">旅途实用</text><text x="600" y="176" font-family="Noto Sans CJK SC" font-size="66" font-weight="700" fill="#203D3A" text-anchor="middle" >日本住宿 · 护照</text><text x="600" y="226" font-family="Noto Sans CJK SC" font-size="34" font-weight="400" fill="#536C65" text-anchor="middle" >证件核验与日常携带分开处理</text><rect x="280" y="278" width="200" height="243" fill="#FFFDF8" rx="24" stroke="#306E63" stroke-width="1.5" stroke-opacity=".20"/><circle cx="380" cy="372" r="73" fill="#306E63" opacity=".08"/><g transform="translate(380,370) scale(0.82)"><rect x="-48" y="-62" width="96" height="128" fill="#306E63" rx="12"/><rect x="-37" y="-51" width="76" height="106" fill="none" rx="7" stroke="#D7E6DF" stroke-width="2"/><circle cx="0" cy="-10" r="25" fill="none" stroke="#F6E7BB" stroke-width="4"/><ellipse cx="0" cy="-10" rx="11" ry="25" fill="none" stro