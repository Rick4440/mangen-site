<text x="600" y="178" font-family="Noto Sans CJK SC,sans-serif" font-size="60" fill="#233832" font-weight="700" text-anchor="middle">瑠璃光院先核预约</text>
<text x="600" y="230" font-family="Noto Sans CJK SC,sans-serif" font-size="35" fill="#586861" font-weight="400" text-anchor="middle">预约期间：11月13日—12月6日</text>
<rect x="260" y="280" width="680" height="72" rx="16" fill="#FFFFFF"/>
<circle cx="307" cy="316" r="24" fill="#8A494A" opacity="1"/>
<text x="307" y="327" font-family="Noto Sans CJK SC,sans-serif" font-size="31" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text>
<text x="358" y="332" font-family="Noto Sans CJK SC,sans-serif" font-size="46" fill="#233832" font-weight="700" text-anchor="start">从官网预约入口进入</text>
<rect x="260" y="370" width="680" height="72" rx="16" fill="#FFFFFF"/>
<circle cx="307" cy="406" r="24" fill="#8A494A" opacity="1"/>
<text x="307" y="417" font-family="Noto Sans CJK SC,sans-serif" font-size="31" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text>
<text x="358" y="422" font-family="Noto Sans CJK SC,sans-serif" font-size="48" fill="#233832" font-weight="700" text-anchor="start">取得预约确认</text>
<rect x="260" y="460" width="680" height="72" rx="16" fill="#FFFFFF"/>
<circle cx="307" cy="496" r="24" fill="#8A494A" opacity="1"/>
<text x="307" y="507" font-family="Noto Sans CJK SC,sans-serif" font-size="31" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text>
<text x="358" y="512" font-family="Noto Sans CJK SC,sans-serif" font-size="46" fill="#233832" font-weight="700" text-anchor="start">再落实往返与行程</text>
<text x="600" y="570" font-family="Noto Sans CJK SC,sans-serif" font-size="42" fill="#8A494A" font-weight="700" text-anchor="middle">免预约：11月12日及以前</text>
<text x="600" y="626" font-family="Noto Sans CJK SC,sans-serif" font-size="42" fill="#8A494A" font-weight="700" text-anchor="middle">及12月7—13日</text>
