<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img">
<title>托运行李出状况，先申报</title>
<desc>万源原创流程示意图，非实景照片。先找航空公司窗口，不按普通失物招领处理</desc>
<rect x="0" y="0.0" width="1200" height="750.0" rx="0" fill="#F6F2E9"/>
<rect x="0" y="0.0" width="18" height="750.0" rx="0" fill="#226C60"/>
<text x="60" y="57.5" font-family="Noto Sans CJK SC" font-size="27.9" fill="#226C60" font-weight="400" text-anchor="start">万源 · 日本旅行实用</text>
<text x="60" y="125.83" font-family="Noto Sans CJK SC" font-size="53.94" fill="#18313B" font-weight="700" text-anchor="start">托运行李出状况，先申报</text>
<text x="60" y="166.67" font-family="Noto Sans CJK SC" font-size="29.76" fill="#596B70" font-weight="400" text-anchor="start">先找航空公司窗口，不按普通失物招领处理</text>
<rect x="60" y="201.67" width="1080" height="83.33" rx="18" fill="#226C60"/>
<text x="600" y="255.83" font-family="Noto Sans CJK SC" font-size="43.71" fill="#FFFFFF" font-weight="700" text-anchor="middle">在到达提取区联系实际承运人</text>
<path d="M 322,285.0 L 322,322.5" fill="none" stroke="#226C60" stroke-width="5" stroke-linecap="round"/>
<path d="M 312,312.5 L 322,322.5 L 332,312.5" fill="none" stroke="#226C60" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 878,285.0 L 878,322.5" fill="none" stroke="#226C60" stroke-width="5" stroke-linecap="round"/>
<path d="M 868,312.5 L 878,322.5 L 888,312.5" fill="none" stroke="#226C60" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="60" y="342.5" width="524" height="222.5" rx="18" fill="#FFFFFF"/>
<rect x="60" y="342.5" width="524" height="10.0" rx="0" fill="#226C60"/>
<text x="322" y="397.5" font-family="Noto Sans CJK SC" font-size="47.43" fill="#226C60" font-weight="700" text-anchor="middle">行李未到</text>
<text x="322" y="460.0" font-family="Noto Sans CJK SC" font-size="38.13" fill="#18313B" font-weight="400" text-anchor="middle">牌证 + 受理编号</text>
<text x="322" y="516.67" font-family="Noto Sans CJK SC" font-size="38.13" fill="#18313B" font-weight="400" text-anchor="middle">通关 + 收件地址</text>
<rect x="616" y="342.5" width="524" height="222.5" rx="18" fill="#FFFFFF"/>
<rect x="616" y="342.5" width="524" height="10.0" rx="0" fill="#B65538"/>
<text x="878" y="397.5" font-family="Noto Sans CJK SC" font-size="47.43" fill="#B65538" font-weight="700" text-anchor="middle">行李破损</text>
<text x="878" y="460.0" font-family="Noto Sans CJK SC" font-size="38.13" fill="#18313B" font-weight="400" text-anchor="middle">全貌 + 破损照片</text>
<text x="878" y="516.67" font-family="Noto Sans CJK SC" font-size="38.13" fill="#18313B" font-weight="400" text-anchor="middle">申报 + 修理指引</text>
<text x="600" y="621.67" font-family="Noto Sans CJK SC" font-size="39.06" fill="#18313B" font-weight="700" text-anchor="middle">保留回执 · 确认后续渠道与期限</text>
<text x="600" y="669.17" font-family="Noto Sans CJK SC" font-size="31.62" fill="#596B70" font-weight="400" text-anchor="middle">不要等回国再处理，也别先丢掉坏箱子</text>
<path d="M 60,700.83 L 1140,700.83" fill="none" stroke="#D3DAD2" stroke-width="2" stroke-linecap="round"/>
<text x="60" y="731.67" font-family="Noto Sans CJK SC" font-size="25.11" fill="#596B70" font-weight="400" text-anchor="start">原创示意 · 非实景照片 · 具体适用条件见正文</text>
<text x="1140" y="731.67" font-family="Noto Sans CJK SC" font-size="25.11" fill="#596B70" font-weight="400" text-anchor="end">2026.11</text>
