<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img">
<title>因雪停飞，先选处理路径</title>
<desc>万源原创流程示意图，非实景照片。先查航班是否进入特别处理，不凭天气图退票</desc>
<rect x="0" y="0.0" width="1200" height="750.0" rx="0" fill="#F6F2E9"/>
<rect x="0" y="0.0" width="18" height="750.0" rx="0" fill="#226C60"/>
<text x="60" y="57.5" font-family="Noto Sans CJK SC" font-size="27.9" fill="#226C60" font-weight="400" text-anchor="start">万源 · 日本旅行实用</text>
<text x="60" y="125.83" font-family="Noto Sans CJK SC" font-size="53.94" fill="#18313B" font-weight="700" text-anchor="start">因雪停飞，先选处理路径</text>
<text x="60" y="166.67" font-family="Noto Sans CJK SC" font-size="29.76" fill="#596B70" font-weight="400" text-anchor="start">先查航班是否进入特别处理，不凭天气图退票</text>
<rect x="60" y="200.0" width="1080" height="86.67" rx="18" fill="#226C60"/>
<text x="600" y="255.0" font-family="Noto Sans CJK SC" font-size="43.71" fill="#FFFFFF" font-weight="700" text-anchor="middle">确认取消原因 + 原出票渠道</text>
<path d="M 322,286.67 L 322,325.0" fill="none" stroke="#226C60" stroke-width="5" stroke-linecap="round"/>
<path d="M 312,315.0 L 322,325.0 L 332,315.0" fill="none" stroke="#226C60" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 878,286.67 L 878,325.0" fill="none" stroke="#226C60" stroke-width="5" stroke-linecap="round"/>
<path d="M 868,315.0 L 878,325.0 L 888,315.0" fill="none" stroke="#226C60" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="60" y="341.67" width="524" height="214.17" rx="18" fill="#FFFFFF"/>
<text x="322" y="395.0" font-family="Noto Sans CJK SC" font-size="42.78" fill="#18313B" font-weight="700" text-anchor="middle">承运人改签</text>
<text x="322" y="459.17" font-family="Noto Sans CJK SC" font-size="36.27" fill="#596B70" font-weight="400" text-anchor="middle">新日期有无空位？</text>
<text x="322" y="512.5" font-family="Noto Sans CJK SC" font-size="36.27" fill="#596B70" font-weight="400" text-anchor="middle">到达时间能否衔接？</text>
<rect x="616" y="341.67" width="524" height="214.17" rx="18" fill="#FFFFFF"/>
<text x="878" y="395.0" font-family="Noto Sans CJK SC" font-size="42.78" fill="#18313B" font-weight="700" text-anchor="middle">退款后自行另订</text>
<text x="878" y="459.17" font-family="Noto Sans CJK SC" font-size="36.27" fill="#596B70" font-weight="400" text-anchor="middle">原票能退多少？</text>
<text x="878" y="512.5" font-family="Noto Sans CJK SC" font-size="36.27" fill="#596B70" font-weight="400" text-anchor="middle">新票与交通总成本？</text>
<rect x="60" y="585.83" width="1080" height="92.5" rx="18" fill="#F0DFD2"/>
<text x="600" y="629.17" font-family="Noto Sans CJK SC" font-size="36.27" fill="#B65538" font-weight="700" text-anchor="middle">天气原因新增酒店、交通</text>
<text x="600" y="666.67" font-family="Noto Sans CJK SC" font-size="35.34" fill="#B65538" font-weight="700" text-anchor="middle">先按自付预算，不默认航司报销</text>
<path d="M 60,700.83 L 1140,700.83" fill="none" stroke="#D3DAD2" stroke-width="2" stroke-linecap="round"/>
<text x="60" y="731.67" font-family="Noto Sans CJK SC" font-size="25.11" fill="#596B70" font-weight="400" text-anchor="start">原创示意 · 非实景照片 · 具体适用条件见正文</text>
<text x="1140" y="731.67" font-family="Noto Sans CJK SC" font-size="25.11" fill="#596B70" font-weight="400" text-anchor="end">2026.11</text>
