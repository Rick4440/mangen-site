<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img">
<title>公交乘车，先认三种模式</title>
<desc>万源原创流程示意图，非实景照片。上车门、付款时点、起点记录要分开判断</desc>
<rect x="0" y="0.0" width="1200" height="750.0" rx="0" fill="#F6F2E9"/>
<rect x="0" y="0.0" width="18" height="750.0" rx="0" fill="#226C60"/>
<text x="60" y="57.5" font-family="Noto Sans CJK SC" font-size="27.9" fill="#226C60" font-weight="400" text-anchor="start">万源 · 日本旅行实用</text>
<text x="60" y="125.83" font-family="Noto Sans CJK SC" font-size="53.94" fill="#18313B" font-weight="700" text-anchor="start">公交乘车，先认三种模式</text>
<text x="60" y="166.67" font-family="Noto Sans CJK SC" font-size="29.76" fill="#596B70" font-weight="400" text-anchor="start">上车门、付款时点、起点记录要分开判断</text>
<rect x="60" y="200.0" width="1080" height="129.17" rx="18" fill="#FFFFFF"/>
<text x="92" y="240.83" font-family="Noto Sans CJK SC" font-size="29.76" fill="#596B70" font-weight="400" text-anchor="start">东京23区内 · 都营巴士</text>
<text x="92" y="292.5" font-family="Noto Sans CJK SC" font-size="43.71" fill="#18313B" font-weight="700" text-anchor="start">前门上车 → 上车付款</text>
<rect x="962" y="225.0" width="144" height="79.17" rx="14" fill="#E7EEE7"/>
<text x="1034" y="275.83" font-family="Noto Sans CJK SC" font-size="39.99" fill="#226C60" font-weight="700" text-anchor="middle">先付</text>
<rect x="60" y="350.0" width="1080" height="129.17" rx="18" fill="#FFFFFF"/>
<text x="92" y="390.83" font-family="Noto Sans CJK SC" font-size="29.76" fill="#596B70" font-weight="400" text-anchor="start">京都市巴士 · 除EX100 / EX101</text>
<text x="92" y="442.5" font-family="Noto Sans CJK SC" font-size="43.71" fill="#18313B" font-weight="700" text-anchor="start">后门上车 → 下车付款</text>
<rect x="962" y="375.0" width="144" height="79.17" rx="14" fill="#E7EEE7"/>
<text x="1034" y="425.83" font-family="Noto Sans CJK SC" font-size="39.99" fill="#226C60" font-weight="700" text-anchor="middle">后付</text>
<rect x="60" y="500.0" width="1080" height="129.17" rx="18" fill="#FFFFFF"/>
<text x="92" y="540.83" font-family="Noto Sans CJK SC" font-size="29.76" fill="#596B70" font-weight="400" text-anchor="start">按区间计价的后付车辆</text>
<text x="92" y="592.5" font-family="Noto Sans CJK SC" font-size="43.71" fill="#18313B" font-weight="700" text-anchor="start">上车记录 → 下车结算</text>
<rect x="962" y="525.0" width="144" height="79.17" rx="14" fill="#E7EEE7"/>
<text x="1034" y="575.83" font-family="Noto Sans CJK SC" font-size="39.99" fill="#226C60" font-weight="700" text-anchor="middle">区间</text>
<text x="600" y="670.83" font-family="Noto Sans CJK SC" font-size="32.55" fill="#B65538" font-weight="700" text-anchor="middle">京都EX100 / EX101：前门上、先付</text>
<path d="M 60,700.83 L 1140,700.83" fill="none" stroke="#D3DAD2" stroke-width="2" stroke-linecap="round"/>
<text x="60" y="731.67" font-family="Noto Sans CJK SC" font-size="25.11" fill="#596B70" font-weight="400" text-anchor="start">原创示意 · 非实景照片 · 具体适用条件见正文</text>
<text x="1140" y="731.67" font-family="Noto Sans CJK SC" font-size="25.11" fill="#596B70" font-weight="400" text-anchor="end">2026.11</text>
</svg>