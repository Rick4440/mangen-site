<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img">
<title>住宿税：先拆账，再查档</title>
<desc>万源原创流程示意图，非实景照片。京都市 / 大阪府 / 东京都 · 2026年秋冬</desc>
<rect x="0" y="0.0" width="1200" height="750.0" rx="0" fill="#F6F2E9"/>
<rect x="0" y="0.0" width="18" height="750.0" rx="0" fill="#226C60"/>
<text x="60" y="57.5" font-family="Noto Sans CJK SC" font-size="27.9" fill="#226C60" font-weight="400" text-anchor="start">万源 · 日本旅行实用</text>
<text x="60" y="125.83" font-family="Noto Sans CJK SC" font-size="53.94" fill="#18313B" font-weight="700" text-anchor="start">住宿税：先拆账，再查档</text>
<text x="60" y="166.67" font-family="Noto Sans CJK SC" font-size="29.76" fill="#596B70" font-weight="400" text-anchor="start">京都市 / 大阪府 / 东京都 · 2026年秋冬</text>
<rect x="60" y="191.67" width="1080" height="94.17" rx="18" fill="#FFFFFF"/>
<circle cx="116" cy="238.33" r="27.5" fill="#226C60"/>
<text x="116" y="250.83" font-family="Noto Sans CJK SC" font-size="37.2" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text>
<text x="178" y="234.17" font-family="Noto Sans CJK SC" font-size="41.85" fill="#18313B" font-weight="700" text-anchor="start">住宿城市 + 实际入住日</text>
<text x="180" y="267.5" font-family="Noto Sans CJK SC" font-size="27.9" fill="#596B70" font-weight="400" text-anchor="start">京都市的税档，不代表整个京都府</text>
<rect x="60" y="300.0" width="1080" height="94.17" rx="18" fill="#FFFFFF"/>
<circle cx="116" cy="346.67" r="27.5" fill="#226C60"/>
<text x="116" y="359.17" font-family="Noto Sans CJK SC" font-size="37.2" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text>
<text x="178" y="342.5" font-family="Noto Sans CJK SC" font-size="41.85" fill="#18313B" font-weight="700" text-anchor="start">每人 · 每晚 · 计税住宿费</text>
<text x="180" y="375.83" font-family="Noto Sans CJK SC" font-size="27.9" fill="#596B70" font-weight="400" text-anchor="start">不要直接使用整笔订单总金额</text>
<rect x="60" y="408.33" width="1080" height="94.17" rx="18" fill="#FFFFFF"/>
<circle cx="116" cy="455.0" r="27.5" fill="#226C60"/>
<text x="116" y="467.5" font-family="Noto Sans CJK SC" font-size="37.2" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text>
<text x="178" y="450.83" font-family="Noto Sans CJK SC" font-size="41.85" fill="#18313B" font-weight="700" text-anchor="start">对应当地现行税档</text>
<text x="180" y="484.17" font-family="Noto Sans CJK SC" font-size="27.9" fill="#596B70" font-weight="400" text-anchor="start">今年住宿，不提前套明年新制</text>
<rect x="60" y="516.67" width="1080" height="94.17" rx="18" fill="#FFFFFF"/>
<circle cx="116" cy="563.33" r="27.5" fill="#226C60"/>
<text x="116" y="575.83" font-family="Noto Sans CJK SC" font-size="37.2" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text>
<text x="178" y="559.17" font-family="Noto Sans CJK SC" font-size="41.85" fill="#18313B" font-weight="700" text-anchor="start">核对已付与现场待付</text>
<text x="180" y="592.5" font-family="Noto Sans CJK SC" font-size="27.9" fill="#596B70" font-weight="400" text-anchor="start">请酒店列明日期、人数与每人税额</text>
<text x="600" y="665.0" font-family="Noto Sans CJK SC" font-size="39.06" fill="#B65538" font-weight="700" text-anchor="middle">房费总额 ≠ 计税住宿费</text>
<path d="M 60,700.83 L 1140,700.83" fill="none" stroke="#D3DAD2" stroke-width="2" stroke-linecap="round"/>
<text x="60" y="731.67" font-family="Noto Sans CJK SC" font-size="25.11" fill="#596B70" font-weight="400" text-anchor="start">原创示意 · 非实景照片 · 具体适用条件见正文</text>
<text x="1140" y="731.67" font-family="Noto Sans CJK SC" font-size="25.11" fill="#596B70" font-weight="400" text-anchor="end">2026.11</text>
</svg>