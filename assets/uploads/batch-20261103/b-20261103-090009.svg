<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img">
<title>小剐蹭，也要完成报备</title>
<desc>万源原创流程示意图，非实景照片。相撞 / 擦护栏 / 停车后发现新伤 · 先如实报告</desc>
<rect x="0" y="0.0" width="1200" height="750.0" rx="0" fill="#F6F2E9"/>
<rect x="0" y="0.0" width="18" height="750.0" rx="0" fill="#226C60"/>
<text x="60" y="57.5" font-family="Noto Sans CJK SC" font-size="27.9" fill="#226C60" font-weight="400" text-anchor="start">万源 · 日本旅行实用</text>
<text x="60" y="125.83" font-family="Noto Sans CJK SC" font-size="53.94" fill="#18313B" font-weight="700" text-anchor="start">小剐蹭，也要完成报备</text>
<text x="60" y="166.67" font-family="Noto Sans CJK SC" font-size="29.76" fill="#596B70" font-weight="400" text-anchor="start">相撞 / 擦护栏 / 停车后发现新伤 · 先如实报告</text>
<rect x="60" y="198.33" width="1080" height="94.17" rx="18" fill="#FFFFFF"/>
<circle cx="116" cy="245.0" r="27.5" fill="#226C60"/>
<text x="116" y="257.5" font-family="Noto Sans CJK SC" font-size="37.2" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text>
<text x="178" y="240.83" font-family="Noto Sans CJK SC" font-size="41.85" fill="#18313B" font-weight="700" text-anchor="start">确保安全，必要时救护</text>
<text x="180" y="274.17" font-family="Noto Sans CJK SC" font-size="27.9" fill="#596B70" font-weight="400" text-anchor="start">不为拍照站在行车道，不冒险继续驾驶</text>
<rect x="60" y="305.0" width="1080" height="94.17" rx="18" fill="#FFFFFF"/>
<circle cx="116" cy="351.67" r="27.5" fill="#226C60"/>
<text x="116" y="364.17" font-family="Noto Sans CJK SC" font-size="37.2" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text>
<text x="178" y="347.5" font-family="Noto Sans CJK SC" font-size="41.85" fill="#18313B" font-weight="700" text-anchor="start">向警方报告事故</text>
<text x="180" y="380.83" font-family="Noto Sans CJK SC" font-size="27.9" fill="#596B70" font-weight="400" text-anchor="start">没有对方车辆，也别自行省略报告</text>
<rect x="60" y="411.67" width="1080" height="94.17" rx="18" fill="#FFFFFF"/>
<circle cx="116" cy="458.33" r="27.5" fill="#226C60"/>
<text x="116" y="470.83" font-family="Noto Sans CJK SC" font-size="37.2" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text>
<text x="178" y="454.17" font-family="Noto Sans CJK SC" font-size="41.85" fill="#18313B" font-weight="700" text-anchor="start">联系租车公司事故窗口</text>
<text x="180" y="487.5" font-family="Noto Sans CJK SC" font-size="27.9" fill="#596B70" font-weight="400" text-anchor="start">警方报告不会自动代替公司报备</text>
<rect x="60" y="518.33" width="1080" height="94.17" rx="18" fill="#FFFFFF"/>
<circle cx="116" cy="565.0" r="27.5" fill="#B65538"/>
<text x="116" y="577.5" font-family="Noto Sans CJK SC" font-size="37.2" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text>
<text x="178" y="560.83" font-family="Noto Sans CJK SC" font-size="41.85" fill="#18313B" font-weight="700" text-anchor="start">确认车辆处置与费用项目</text>
<text x="180" y="594.17" font-family="Noto Sans CJK SC" font-size="27.9" fill="#596B70" font-weight="400" text-anchor="start">按指引决定拖车、还车或后续使用</text>
<text x="600" y="666.67" font-family="Noto Sans CJK SC" font-size="37.2" fill="#B65538" font-weight="700" text-anchor="middle">免赔额补偿 ≠ 自动免除NOC</text>
<path d="M 60,700.83 L 1140,700.83" fill="none" stroke="#D3DAD2" stroke-width="2" stroke-linecap="round"/>
<text x="60" y="731.67" font-family="Noto Sans CJK SC" font-size="25.11" fill="#596B70" font-weight="400" text-anchor="start">原创示意 · 非实景照片 · 具体适用条件见正文</text>
<text x="1140" y="731.67" font-family="Noto Sans CJK SC" font-size="25.11" fill="#596B70" font-weight="400" text-anchor="end">2026.11</text>
</svg>