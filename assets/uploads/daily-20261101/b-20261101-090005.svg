<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img">
<title>初次滑雪，按这个顺序订</title>
<rect width="1600" height="1100" fill="#f5f2eb"/>
<rect width="24" height="1100" fill="#603e32"/>
<text x="85" y="88" font-family="Noto Sans CJK SC" font-size="24" font-weight="600" fill="#9e6250">JAPAN TRAVEL   /   2026</text>
<text x="85" y="164" font-family="Noto Sans CJK SC" font-size="44" font-weight="700" fill="#603e32">初次滑雪，按这个顺序订</text>
<text x="85" y="213" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#9e6250">语言与课程先确定，雪票和租具再配齐</text>
<text x="85" y="256" font-family="Noto Sans CJK SC" font-size="23" font-weight="400" fill="#68716e">核验日期：2026年11月1日 · 完整条件与官方来源见正文</text>
<rect x="85" y="285" width="685" height="252" rx="20" fill="white"/>
<circle cx="137" cy="342" r="25" fill="#9e6250"/>
<text x="129" y="352" font-family="Noto Sans CJK SC" font-size="27" font-weight="700" fill="white">1</text>
<text x="180" y="355" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#603e32">先锁教学语言</text>
<text x="123" y="417" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#626a68">中文客服不等于中文授课</text>
<text x="123" y="460" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#626a68">确认教练与报名入口</text>
<rect x="820" y="285" width="685" height="252" rx="20" fill="white"/>
<circle cx="872" cy="342" r="25" fill="#9e6250"/>
<text x="864" y="352" font-family="Noto Sans CJK SC" font-size="27" font-weight="700" fill="white">2</text>
<text x="915" y="355" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#603e32">再核课程条件</text>
<text x="858" y="417" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#626a68">年龄、项目、水平分别写</text>
<text x="858" y="460" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#626a68">家庭不一定适合同一班</text>
<rect x="85" y="575" width="685" height="252" rx="20" fill="white"/>
<circle cx="137" cy="632" r="25" fill="#9e6250"/>
<text x="129" y="642" font-family="Noto Sans CJK SC" font-size="27" font-weight="700" fill="white">3</text>
<text x="180" y="645" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#603e32">拆开四项费用</text>
<text x="123" y="707" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#626a68">课程、雪票、租具、衣物</text>
<text x="123" y="750" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#626a68">套装不一定含头盔手套</text>
<rect x="820" y="575" width="685" height="252" rx="20" fill="white"/>
<circle cx="872" cy="632" r="25" fill="#9e6250"/>
<text x="864" y="642" font-family="Noto Sans CJK SC" font-size="27" font-weight="700" fill="white">4</text>
<text x="915" y="645" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#603e32">倒推集合时间</text>
<text x="858" y="707" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#626a68">取具试鞋后再到集合点</text>
<text x="858" y="750" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#626a68">下课也要预留还具时间</text>
<text x="85" y="899" font-family="Noto Sans CJK SC" font-size="27" font-weight="400" fill="#603e32">野沢本季预约：11月8日11:00日本时间；各校另查</text>
<path d="M85 930H1515" stroke="#c9cec7" stroke-width="2"/>
<text x="85" y="983" font-family="Noto Sans CJK SC" font-size="27" font-weight="400" fill="#69736f">万源原创信息图 · 非实景照片 / 非地图</text>
<text x="85" y="1030" font-family="Noto Sans CJK SC" font-size="25" font-weight="400" fill="#69736f">用于解释决策步骤，不代表实时余票、运营状态或个案获准结果。</text>
</svg>