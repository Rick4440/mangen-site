<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img">
<title>丢护照，四条事项接起来</title>
<rect width="1600" height="1100" fill="#f5f2eb"/>
<rect width="24" height="1100" fill="#603e32"/>
<text x="85" y="88" font-family="Noto Sans CJK SC" font-size="24" font-weight="600" fill="#9e6250">JAPAN TRAVEL   /   2026</text>
<text x="85" y="164" font-family="Noto Sans CJK SC" font-size="44" font-weight="700" fill="#603e32">丢护照，四条事项接起来</text>
<text x="85" y="213" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#9e6250">适用临时来日持中国普通护照的大陆游客</text>
<text x="85" y="256" font-family="Noto Sans CJK SC" font-size="23" font-weight="400" fill="#68716e">核验日期：2026年11月1日 · 完整条件与官方来源见正文</text>
<rect x="85" y="285" width="685" height="252" rx="20" fill="white"/>
<circle cx="137" cy="342" r="25" fill="#9e6250"/>
<text x="129" y="352" font-family="Noto Sans CJK SC" font-size="27" font-weight="700" fill="white">1</text>
<text x="180" y="355" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#603e32">警方报失留记录</text>
<text x="123" y="417" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#626a68">保留受理编号与联系信息</text>
<text x="123" y="460" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#626a68">报失记录不能代替证件</text>
<rect x="820" y="285" width="685" height="252" rx="20" fill="white"/>
<circle cx="872" cy="342" r="25" fill="#9e6250"/>
<text x="864" y="352" font-family="Noto Sans CJK SC" font-size="27" font-weight="700" fill="white">2</text>
<text x="915" y="355" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#603e32">联系所属使领馆</text>
<text x="858" y="417" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#626a68">按本馆入口和材料办理</text>
<text x="858" y="460" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#626a68">加急不保证当天出证</text>
<rect x="85" y="575" width="685" height="252" rx="20" fill="white"/>
<circle cx="137" cy="632" r="25" fill="#9e6250"/>
<text x="129" y="642" font-family="Noto Sans CJK SC" font-size="27" font-weight="700" fill="white">3</text>
<text x="180" y="645" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#603e32">核对日本手续</text>
<text x="123" y="707" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#626a68">临近停留期限及时咨询</text>
<text x="123" y="750" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#626a68">补证与停留事项分开办</text>
<rect x="820" y="575" width="685" height="252" rx="20" fill="white"/>
<circle cx="872" cy="632" r="25" fill="#9e6250"/>
<text x="864" y="642" font-family="Noto Sans CJK SC" font-size="27" font-weight="700" fill="white">4</text>
<text x="915" y="645" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#603e32">确认新证件航程</text>
<text x="858" y="707" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#626a68">向航司更新证件资料</text>
<text x="858" y="750" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#626a68">中转与入境条件逐段核对</text>
<text x="85" y="899" font-family="Noto Sans CJK SC" font-size="27" font-weight="400" fill="#603e32">旧照已作废，即使找回也不要自行恢复使用</text>
<path d="M85 930H1515" stroke="#c9cec7" stroke-width="2"/>
<text x="85" y="983" font-family="Noto Sans CJK SC" font-size="27" font-weight="400" fill="#69736f">万源原创信息图 · 非实景照片 / 非地图</text>
<text x="85" y="1030" font-family="Noto Sans CJK SC" font-size="25" font-weight="400" fill="#69736f">用于解释决策步骤，不代表实时余票、运营状态或个案获准结果。</text>
</svg>