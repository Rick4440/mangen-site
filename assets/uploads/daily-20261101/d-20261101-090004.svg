<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img">
<title>仙岩园菊展：按节目选日</title>
<rect width="1600" height="1100" fill="#f5f2eb"/>
<rect width="24" height="1100" fill="#253b59"/>
<text x="85" y="88" font-family="Noto Sans CJK SC" font-size="24" font-weight="600" fill="#557b9b">JAPAN TRAVEL   /   2026</text>
<text x="85" y="164" font-family="Noto Sans CJK SC" font-size="44" font-weight="700" fill="#253b59">仙岩园菊展：按节目选日</text>
<text x="85" y="213" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#557b9b">2026年11月，不是每天都有演出</text>
<text x="85" y="256" font-family="Noto Sans CJK SC" font-size="23" font-weight="400" fill="#68716e">核验日期：2026年11月1日 · 完整条件与官方来源见正文</text>
<rect x="85" y="285" width="685" height="252" rx="20" fill="white"/>
<circle cx="137" cy="342" r="25" fill="#557b9b"/>
<text x="129" y="352" font-family="Noto Sans CJK SC" font-size="27" font-weight="700" fill="white">1</text>
<text x="180" y="355" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#253b59">11/1—11/30菊展</text>
<text x="123" y="417" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#626a68">普通入园票可看</text>
<text x="123" y="460" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#626a68">花况受天气影响</text>
<rect x="820" y="285" width="685" height="252" rx="20" fill="white"/>
<circle cx="872" cy="342" r="25" fill="#557b9b"/>
<text x="864" y="352" font-family="Noto Sans CJK SC" font-size="27" font-weight="700" fill="white">2</text>
<text x="915" y="355" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#253b59">11/8 见所导览</text>
<text x="858" y="417" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#626a68">年票限定／需提前报名</text>
<text x="858" y="460" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#626a68">10:30—11:30，各20名</text>
<rect x="85" y="575" width="685" height="252" rx="20" fill="white"/>
<circle cx="137" cy="632" r="25" fill="#557b9b"/>
<text x="129" y="642" font-family="Noto Sans CJK SC" font-size="27" font-weight="700" fill="white">3</text>
<text x="180" y="645" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#253b59">11/14 传统艺能</text>
<text x="123" y="707" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#626a68">和乐器与传统表演</text>
<text x="123" y="750" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#626a68">具体时刻查官方</text>
<rect x="820" y="575" width="685" height="252" rx="20" fill="white"/>
<circle cx="872" cy="632" r="25" fill="#557b9b"/>
<text x="864" y="642" font-family="Noto Sans CJK SC" font-size="27" font-weight="700" fill="white">4</text>
<text x="915" y="645" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#253b59">11/15 狮舞</text>
<text x="858" y="707" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#626a68">无病息灾祈愿演出</text>
<text x="858" y="750" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#626a68">具体时刻查官方</text>
<text x="85" y="899" font-family="Noto Sans CJK SC" font-size="27" font-weight="400" fill="#253b59">11/23导览10:30—11:15也需报名；普通入园16:30截止。非实拍。</text>
<path d="M85 930H1515" stroke="#c9cec7" stroke-width="2"/>
<text x="85" y="983" font-family="Noto Sans CJK SC" font-size="27" font-weight="400" fill="#69736f">万源原创信息图 · 非实景照片 / 非地图</text>
<text x="85" y="1030" font-family="Noto Sans CJK SC" font-size="25" font-weight="400" fill="#69736f">用于解释决策步骤，不代表实时余票、运营状态或个案获准结果。</text>
</svg>