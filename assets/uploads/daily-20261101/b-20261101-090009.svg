<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img">
<title>实名电子票，出发前验四项</title>
<rect width="1600" height="1100" fill="#f5f2eb"/>
<rect width="24" height="1100" fill="#234d48"/>
<text x="85" y="88" font-family="Noto Sans CJK SC" font-size="24" font-weight="600" fill="#a47b3d">JAPAN TRAVEL   /   2026</text>
<text x="85" y="164" font-family="Noto Sans CJK SC" font-size="44" font-weight="700" fill="#234d48">实名电子票，出发前验四项</text>
<text x="85" y="213" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#a47b3d">付款成功，不等于任何人都能用票入场</text>
<text x="85" y="256" font-family="Noto Sans CJK SC" font-size="23" font-weight="400" fill="#68716e">核验日期：2026年11月1日 · 完整条件与官方来源见正文</text>
<rect x="85" y="285" width="685" height="252" rx="20" fill="white"/>
<circle cx="137" cy="342" r="25" fill="#a47b3d"/>
<text x="129" y="352" font-family="Noto Sans CJK SC" font-size="27" font-weight="700" fill="white">1</text>
<text x="180" y="355" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#234d48">核对该场规则</text>
<text x="123" y="417" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#626a68">从主办方进入购票页面</text>
<text x="123" y="460" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#626a68">检查证件与同行者条件</text>
<rect x="820" y="285" width="685" height="252" rx="20" fill="white"/>
<circle cx="872" cy="342" r="25" fill="#a47b3d"/>
<text x="864" y="352" font-family="Noto Sans CJK SC" font-size="27" font-weight="700" fill="white">2</text>
<text x="915" y="355" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#234d48">实际下载有效票</text>
<text x="858" y="417" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#626a68">核对手机、账号、号码</text>
<text x="858" y="460" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#626a68">eplusスマチケ不可截图入场</text>
<rect x="85" y="575" width="685" height="252" rx="20" fill="white"/>
<circle cx="137" cy="632" r="25" fill="#a47b3d"/>
<text x="129" y="642" font-family="Noto Sans CJK SC" font-size="27" font-weight="700" fill="white">3</text>
<text x="180" y="645" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#234d48">按官方方式分票</text>
<text x="123" y="707" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#626a68">有分票按钮不等于可改名</text>
<text x="123" y="750" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#626a68">无法分票先询问主办方</text>
<rect x="820" y="575" width="685" height="252" rx="20" fill="white"/>
<circle cx="872" cy="632" r="25" fill="#a47b3d"/>
<text x="864" y="642" font-family="Noto Sans CJK SC" font-size="27" font-weight="700" fill="white">4</text>
<text x="915" y="645" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#234d48">不能赴约查转售</text>
<text x="858" y="707" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#626a68">只看该场官方许可渠道</text>
<text x="858" y="750" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#626a68">可申请不等于保证成交</text>
<text x="85" y="899" font-family="Noto Sans CJK SC" font-size="27" font-weight="400" fill="#234d48">法律适用与合同入场条件应分别核对</text>
<path d="M85 930H1515" stroke="#c9cec7" stroke-width="2"/>
<text x="85" y="983" font-family="Noto Sans CJK SC" font-size="27" font-weight="400" fill="#69736f">万源原创信息图 · 非实景照片 / 非地图</text>
<text x="85" y="1030" font-family="Noto Sans CJK SC" font-size="25" font-weight="400" fill="#69736f">用于解释决策步骤，不代表实时余票、运营状态或个案获准结果。</text>
</svg>