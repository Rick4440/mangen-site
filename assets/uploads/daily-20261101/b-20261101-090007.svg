<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img">
<title>雪板搭机，逐段核对</title>
<rect width="1600" height="1100" fill="#f5f2eb"/>
<rect width="24" height="1100" fill="#253b59"/>
<text x="85" y="88" font-family="Noto Sans CJK SC" font-size="24" font-weight="600" fill="#557b9b">JAPAN TRAVEL   /   2026</text>
<text x="85" y="164" font-family="Noto Sans CJK SC" font-size="44" font-weight="700" fill="#253b59">雪板搭机，逐段核对</text>
<text x="85" y="213" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#557b9b">能托运、免费额度、能装下要分别确认</text>
<text x="85" y="256" font-family="Noto Sans CJK SC" font-size="23" font-weight="400" fill="#68716e">核验日期：2026年11月1日 · 完整条件与官方来源见正文</text>
<rect x="85" y="285" width="685" height="252" rx="20" fill="white"/>
<circle cx="137" cy="342" r="25" fill="#557b9b"/>
<text x="129" y="352" font-family="Noto Sans CJK SC" font-size="27" font-weight="700" fill="white">1</text>
<text x="180" y="355" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#253b59">量整袋而非板长</text>
<text x="123" y="417" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#626a68">记录长宽高、重量、件数</text>
<text x="123" y="460" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#626a68">雪鞋另装也要写清楚</text>
<rect x="820" y="285" width="685" height="252" rx="20" fill="white"/>
<circle cx="872" cy="342" r="25" fill="#557b9b"/>
<text x="864" y="352" font-family="Noto Sans CJK SC" font-size="27" font-weight="700" fill="white">2</text>
<text x="915" y="355" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#253b59">查实际承运人</text>
<text x="858" y="417" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#626a68">ANA、JAL与廉航分开看</text>
<text x="858" y="460" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#626a68">国际联程别套国内单票</text>
<rect x="85" y="575" width="685" height="252" rx="20" fill="white"/>
<circle cx="137" cy="632" r="25" fill="#557b9b"/>
<text x="129" y="642" font-family="Noto Sans CJK SC" font-size="27" font-weight="700" fill="white">3</text>
<text x="180" y="645" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#253b59">核超限与机型</text>
<text x="123" y="707" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#626a68">尺寸特例不等于全免费</text>
<text x="123" y="750" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#626a68">小型机提前确认能否装载</text>
<rect x="820" y="575" width="685" height="252" rx="20" fill="white"/>
<circle cx="872" cy="632" r="25" fill="#557b9b"/>
<text x="864" y="642" font-family="Noto Sans CJK SC" font-size="27" font-weight="700" fill="white">4</text>
<text x="915" y="645" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#253b59">转机看重托运</text>
<text x="858" y="707" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#626a68">Peach不提供行李直挂</text>
<text x="858" y="750" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#626a68">留够提取与再次交件时间</text>
<text x="85" y="899" font-family="Noto Sans CJK SC" font-size="27" font-weight="400" fill="#253b59">先确认客票额度与器材条件，再比较总费用</text>
<path d="M85 930H1515" stroke="#c9cec7" stroke-width="2"/>
<text x="85" y="983" font-family="Noto Sans CJK SC" font-size="27" font-weight="400" fill="#69736f">万源原创信息图 · 非实景照片 / 非地图</text>
<text x="85" y="1030" font-family="Noto Sans CJK SC" font-size="25" font-weight="400" fill="#69736f">用于解释决策步骤，不代表实时余票、运营状态或个案获准结果。</text>
</svg>