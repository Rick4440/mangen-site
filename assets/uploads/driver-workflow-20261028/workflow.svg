<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#f5f1e9"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="800" y="190" text-anchor="middle" font-size="28" letter-spacing="7" fill="#846942">MANGEN · 日本交通科普</text><text x="800" y="280" text-anchor="middle" font-size="58" font-weight="bold" fill="#183b37">乘客看不见的安全工作</text><text x="800" y="340" text-anchor="middle" font-size="28" fill="#56645e">预约制ハイヤー · 从出车准备到收车归库</text><rect x="140" y="410" width="380" height="270" rx="24" fill="#fff" stroke="#ddd6c7" stroke-width="2"/><text x="175" y="463" font-size="24" fill="#997a48">01</text><text x="330" y="524" text-anchor="middle" font-size="42" font-weight="bold" fill="#183b37">出车前</text><text x="330" y="591" text-anchor="middle" font-size="29" fill="#435852">车辆日常点检</text><text x="330" y="637" text-anchor="middle" font-size="29" fill="#435852">点呼与状态确认</text><rect x="610" y="410" width="380" height="270" rx="24" fill="#fff" stroke="#ddd6c7" stroke-width="2"/><text x="645" y="463" font-size="24" fill="#997a48">02</text><text x="800" y="524" text-anchor="middle" font-size="42" font-weight="bold" fill="#183b37">服务中</text><text x="800" y="591" text-anchor="middle" font-size="29" fill="#435852">安全运行安排</text><text x="800" y="637" text-anchor="middle" font-size="29" fill="#435852">应对变化与休息</text><rect x="1080" y="410" width="380" height="270" rx="24" fill="#fff" stroke="#ddd6c7" stroke-width="2"/><text x="1115" y="463" font-size="24" fill="#997a48">03</text><text x="1270" y="524" text-anchor="middle" font-size="42" font-weight="bold" fill="#183b37">结束后</text><text x="1270" y="591" text-anchor="middle" font-size="29" fill="#435852">业务后点呼</text><text x="1270" y="637" text-anchor="middle" font-size="29" fill="#435852">报告、记录与交接</text><path d="M 548 545 h 34 m -12 -12 l 12 12 -12 12" stroke="#997a48" stroke-width="4" fill="none"/><path d="M 1018 545 h 34 m -12 -12 l 12 12 -12 12" stroke="#997a48" stroke-width="4" fill="none"/><text x="800" y="757" text-anchor="middle" font-size="30" fill="#183b37">管理有要求 · 异常有处理 · 责任可追溯</text><text x="800" y="825" text-anchor="middle" font-size="23" fill="#69746f">原创流程示意，非实拍或任何公司的实际作业记录</text><text x="800" y="867" text-anchor="middle" font-size="23" fill="#69746f">法定义务与常见公司安排的区别，请见正文</text></g></svg>