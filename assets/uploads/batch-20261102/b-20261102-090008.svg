<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect x="0" y="0" width="1440" height="1000" rx="0" fill="#F4F1EA"/><rect x="0" y="0" width="22" height="1000" rx="0" fill="#687A31"/><text x="78" y="79" font-family="Noto Sans CJK SC" font-size="29" font-weight="700" fill="#687A31">MANGEN  |  旅行实用</text><text x="78" y="168" font-family="Noto Sans CJK SC" font-size="58" font-weight="700" fill="#263744">有熊出没提醒，先改路线</text><rect x="76" y="245" width="1288" height="170" rx="20" fill="#FFFFFF"/><rect x="76" y="245" width="15" height="170" rx="5" fill="#687A31"/><text x="125" y="313" font-family="Noto Sans CJK SC" font-size="46" font-weight="700" fill="#687A31">查具体地点与时间</text><text x="125" y="373" font-family="Noto Sans CJK SC" font-size="37" font-weight="400" fill="#263744">城市名称不够：还要看步道和最后一段路</text><rect x="76" y="450" width="1288" height="170" rx="20" fill="#FFFFFF"/><rect x="76" y="450" width="15" height="170" rx="5" fill="#687A31"/><text x="125" y="518" font-family="Noto Sans CJK SC" font-size="46" font-weight="700" fill="#687A31">有封闭 / 劝返指示</text><text x="125" y="578" font-family="Noto Sans CJK SC" font-size="37" font-weight="400" fill="#263744">停止进入；不绕过封锁带</text><rect x="76" y="655" width="1288" height="170" rx="20" fill="#FFFFFF"/><rect x="76" y="655" width="15" height="170" rx="5" fill="#687A31"/><text x="125" y="723" font-family="Noto Sans CJK SC" font-size="46" font-weight="700" fill="#687A31">信息不清 / 接驳不确定</text><text x="125" y="783" font-family="Noto Sans CJK SC" font-size="37" font-weight="400" fill="#263744">联系管理者；改室内或延期，不赌原路线</text><text x="80" y="950" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" fill="#5C6870">原创示意图 · 2026年11月核验 · 适用条件与官方来源见正文</text></svg>