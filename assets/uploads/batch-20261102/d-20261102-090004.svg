<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#f5f2e9"/><rect x="0" y="0" width="1200" height="186" fill="#254d62"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="90" y="88" fill="white" font-size="49" font-weight="bold">保津川下：秋冬乘船准备</text><text x="90" y="146" fill="#e4e9de" font-size="30">龟冈 → 岚山 · 单向游船，非原码头往返</text><rect x="80" y="220" width="1040" height="132" rx="18" fill="white"/><rect x="80" y="220" width="12" height="132" rx="6" fill="#254d62"/><text x="120" y="270" fill="#254d62" font-size="38" font-weight="bold">第一步：查日期与可订船班</text><text x="120" y="322" fill="#303c3a" font-size="34">12/14—28营业10:00—14:30，另核船班</text><text x="1070" y="272" text-anchor="end" fill="#254d62" font-size="34">预约</text><rect x="80" y="374" width="1040" height="132" rx="18" fill="white"/><rect x="80" y="374" width="12" height="132" rx="6" fill="#254d62"/><text x="120" y="424" fill="#254d62" font-size="38" font-weight="bold">第二步：确认车站到码头移动</text><text x="120" y="476" fill="#303c3a" font-size="34">列车票与船票分开；不要贴点换乘</text><text x="1070" y="426" text-anchor="end" fill="#254d62" font-size="34">衔接</text><rect x="80" y="528" width="1040" height="132" rx="18" fill="white"/><rect x="80" y="528" width="12" height="132" rx="6" fill="#254d62"/><text x="120" y="578" fill="#254d62" font-size="38" font-weight="bold">第三步：无暖房，准备防寒</text><text x="120" y="630" fill="#303c3a" font-size="34">当天查运航；穿好救生衣，听从船头</text><text x="1070" y="580" text-anchor="end" fill="#254d62" font-size="34">出发前</text><text x="90" y="744" fill="#43554e" font-size="27">营业时段不等于随到随开；12/29起年末休运</text><text x="90" y="780" fill="#68746d" font-size="22">万源原创信息图 · 非实景 / 非地图 · 核验 2026-11-02</text></g></svg>