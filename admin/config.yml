# Decap CMS 配置文件 — 万源静态站
#
# Decap 写入 /content/ 下的 JSON / Markdown 文件
# Cloudflare Pages 自动部署（GitHub → CF Pages 集成）
# 后台地址：https://mangen.jp/admin/

# ✅ 已配置：
#   - backend.name: github
#   - backend.repo: Rick4440/mangen-site
#   - backend.branch: main
#   - backend.base_url: https://mangen.jp  （Cloudflare Pages 域名）
# GitHub OAuth 需要独立认证服务；Cloudflare Pages 的 GitHub 部署连接不提供 CMS 登录。

backend:
  name: github
  repo: Rick4440/mangen-site           # GitHub repo
  branch: main
  base_url: https://mangen.jp
  auth_endpoint: api/auth
  open_authoring: false
  squash_merges: true

# 媒体（图片）上传到同一 repo 的 assets/uploads/ 目录
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

# 站点预览（编辑后保存前预览）
site_url: https://mangen.jp
display_url: https://mangen.jp
logo_url: /assets/img/logo.png

# 3 个 Collection：公司信息、车型、博客
collections:
  # 1. 全局公司信息（电话、地址、资质、邮箱、Schema）
  - name: "company-info"
    label: "公司信息（电话/地址/资质）"
    label_singular: "公司信息"
    description: "公司电话、地址、资质、邮箱等。修改后全站生效。"
    files:
      - name: "company"
        label: "全局公司信息"
        file: "content/settings/company.json"
        fields:
          - { label: "公司正式名称（日文）", name: "company_name", widget: "string" }
          - label: "公司名称多语言"
            name: "company_name_i18n"
            widget: "object"
            fields:
              - { label: "日文", name: "ja", widget: "string" }
              - { label: "中文", name: "zh", widget: "string" }
              - { label: "英文", name: "en", widget: "string" }
          - label: "公司介绍段落（多语言）"
            name: "desc_i18n"
            widget: "object"
            fields:
              - { label: "日文", name: "ja", widget: "text" }
              - { label: "中文", name: "zh", widget: "text" }
              - { label: "英文", name: "en", widget: "text" }
          - label: "电话"
            name: "phones"
            widget: "list"
            fields:
              - { label: "城市（内部）", name: "city", widget: "string" }
              - label: "城市显示（多语言）"
                name: "city_i18n"
                widget: "object"
                fields:
                  - { label: "日文", name: "ja", widget: "string" }
                  - { label: "中文", name: "zh", widget: "string" }
                  - { label: "英文", name: "en", widget: "string" }
              - { label: "显示用号码", name: "display", widget: "string" }
              - { label: "号码（去 -）", name: "number", widget: "string" }
              - { label: "国际格式", name: "intl", widget: "string" }
          - label: "资质"
            name: "license"
            widget: "object"
            fields:
              - label: "资质 1"
                name: "1"
                widget: "object"
                fields:
                  - { label: "文字", name: "value", widget: "string" }
                  - { label: "日文说明", name: "ja", widget: "string" }
                  - { label: "中文说明", name: "zh", widget: "string" }
                  - { label: "英文说明", name: "en", widget: "string" }
              - label: "资质 2"
                name: "2"
                widget: "object"
                fields:
                  - { label: "文字", name: "value", widget: "string" }
                  - { label: "日文说明", name: "ja", widget: "string" }
                  - { label: "中文说明", name: "zh", widget: "string" }
                  - { label: "英文说明", name: "en", widget: "string" }
          - label: "联系方式徽章（LINE/微信/WhatsApp/Mail）"
            name: "channels"
            widget: "list"
            fields:
              - { label: "渠道标签（内部）", name: "label", widget: "string" }
              - label: "标签多语言"
                name: "label_i18n"
                widget: "object"
                fields:
                  - { label: "日文", name: "ja", widget: "string" }
                  - { label: "中文", name: "zh", widget: "string" }
                  - { label: "英文", name: "en", widget: "string" }
              - { label: "实际值（ID/邮箱等，未开通填「準備中」）", name: "value", widget: "string" }
              - { label: "未开通则隐藏", name: "pending", widget: "boolean", required: false, default: false }
              - label: "未开通时的多语言提示（页面在开通前不显示）"
                name: "value_i18n"
                widget: "object"
                required: false
                fields:
                  - { label: "日文", name: "ja", widget: "string" }
                  - { label: "中文", name: "zh", widget: "string" }
                  - { label: "英文", name: "en", widget: "string" }
          - label: "公司信息展示（多语言）"
            name: "info_rows_i18n"
            widget: "object"
            fields:
              - { label: "日文", name: "ja", widget: "list", fields: [{ label: "项目", name: "label", widget: "string" }, { label: "内容", name: "value", widget: "string" }] }
              - { label: "中文", name: "zh", widget: "list", fields: [{ label: "项目", name: "label", widget: "string" }, { label: "内容", name: "value", widget: "string" }] }
              - { label: "英文", name: "en", widget: "list", fields: [{ label: "项目", name: "label", widget: "string" }, { label: "内容", name: "value", widget: "string" }] }
          - label: "搜索引擎公司资料"
            name: "schema"
            widget: "object"
            collapsed: true
            fields:
              - { label: "上下文", name: "@context", widget: "hidden", default: "https://schema.org" }
              - { label: "类型", name: "@type", widget: "hidden", default: "LocalBusiness" }
              - { label: "公司标识", name: "@id", widget: "string" }
              - { label: "公司名", name: "name", widget: "string" }
              - { label: "英文名", name: "alternateName", widget: "string" }
              - { label: "简介", name: "description", widget: "text" }
              - { label: "网址", name: "url", widget: "string" }
              - { label: "电话", name: "telephone", widget: "string" }
              - { label: "价格区间", name: "priceRange", widget: "string" }
              - label: "注册地址"
                name: "address"
                widget: "object"
                fields:
                  - { label: "类型", name: "@type", widget: "hidden", default: "PostalAddress" }
                  - { label: "街道", name: "streetAddress", widget: "string" }
                  - { label: "市区", name: "addressLocality", widget: "string" }
                  - { label: "都道府县", name: "addressRegion", widget: "string" }
                  - { label: "邮编", name: "postalCode", widget: "string" }
                  - { label: "国家", name: "addressCountry", widget: "string" }
              - label: "服务地区"
                name: "areaServed"
                widget: "list"
                fields:
                  - { label: "类型", name: "@type", widget: "string", default: "AdministrativeArea" }
                  - { label: "名称", name: "name", widget: "string" }
              - label: "东京据点"
                name: "department"
                widget: "object"
                required: false
                fields:
                  - { label: "类型", name: "@type", widget: "string" }
                  - { label: "名称", name: "name", widget: "string" }
                  - { label: "电话", name: "telephone", widget: "string" }
              - { label: "服务语言", name: "availableLanguage", widget: "list", field: { label: "语言代码", name: "language", widget: "string" } }
              - { label: "营业时间", name: "openingHours", widget: "string" }

  # 2. 车型
  - name: "fleet"
    label: "车型"
    label_singular: "车型"
    description: "公司可用的车型。增删改后首页车型区会实时更新。"
    files:
      - name: "fleet"
        label: "车型数据"
        file: "content/fleet/fleet.json"
        fields:
          - label: "车型列表"
            name: "items"
            widget: "list"
            fields:
              - { label: "内部 ID（英文）", name: "id", widget: "string" }
              - { label: "排序（1 在最前）", name: "order", widget: "number", default: 1, value_type: "int", min: 1 }
              - { label: "车型图片", name: "image", widget: "image", hint: "可选已有图片或上传新图" }
              - { label: "车名（日文默认）", name: "name", widget: "string" }
              - { label: "座位说明（日文默认）", name: "seats", widget: "string" }
              - { label: "行李说明（日文默认）", name: "luggage", widget: "string" }
              - { label: "适合用途（日文默认）", name: "use", widget: "string" }
              - label: "车名多语言"
                name: "name_i18n"
                widget: "object"
                fields:
                  - { label: "日文", name: "ja", widget: "string" }
                  - { label: "中文", name: "zh", widget: "string" }
                  - { label: "英文", name: "en", widget: "string" }
              - label: "座位多语言"
                name: "seats_i18n"
                widget: "object"
                fields:
                  - { label: "日文", name: "ja", widget: "string" }
                  - { label: "中文", name: "zh", widget: "string" }
                  - { label: "英文", name: "en", widget: "string" }
              - label: "行李多语言"
                name: "luggage_i18n"
                widget: "object"
                fields:
                  - { label: "日文", name: "ja", widget: "string" }
                  - { label: "中文", name: "zh", widget: "string" }
                  - { label: "英文", name: "en", widget: "string" }
              - label: "适合用途多语言"
                name: "use_i18n"
                widget: "object"
                fields:
                  - { label: "日文", name: "ja", widget: "string" }
                  - { label: "中文", name: "zh", widget: "string" }
                  - { label: "英文", name: "en", widget: "string" }

  # 3. 博客文章（一个文件一篇文章）
  - name: "blog"
    label: "博客文章"
    label_singular: "文章"
    description: "中文 SEO 博客。新增后会自动出现在 /blog/ 列表。"
    folder: "content/posts"
    create: true
    identifier_field: category
    slug: "{{fields.category}}-{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}"
    preview_path: "blog/{{filename}}"
    summary: "{{title_i18n.zh}} · {{date}}"
    sortable_fields: ["date", "title_i18n.zh", "category", "commit_date"]
    view_filters:
      - { label: "知识科普", field: "category", pattern: "c" }
      - { label: "包车指南", field: "category", pattern: "a" }
      - { label: "旅行指南", field: "category", pattern: "b" }
      - { label: "线路规划", field: "category", pattern: "d" }
      - { label: "已下线", field: "draft", pattern: true }
    view_groups:
      - { label: "发布日期", field: "date", pattern: "\\d{4}-\\d{2}" }
      - { label: "分类", field: "category" }
    extension: "md"
    format: "frontmatter"
    fields:
      - label: "发布日期"
        name: "date"
        widget: "datetime"
        default: "{{now}}"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
      - label: "文章分类（同时用于自动生成网址）"
        name: "category"
        widget: "select"
        options:
          - { label: "包车指南（a）", value: "a" }
          - { label: "旅行指南（b）", value: "b" }
          - { label: "知识科普（c）", value: "c" }
          - { label: "线路规划（d）", value: "d" }
          - { label: "公司动态（e）", value: "e" }
        default: "c"
        hint: "选择分类后，系统会自动生成网址编号，不需要另外填写英文网址名。"
      - { label: "下线（勾选后从网站及 sitemap 移除）", name: "draft", widget: "boolean", default: false, required: false }
      - { label: "文章封面图（可选）", name: "cover_image", widget: "image", required: false, hint: "上传后用于文章顶部及分享卡片；正文可用图片按钮插图。" }
      - label: "目的地（可选）"
        name: "destinations"
        widget: "select"
        multiple: true
        required: false
        options: ["全日本", "东京", "京都", "大阪", "奈良", "富士山", "箱根", "北海道", "冲绳", "名古屋", "福冈"]
        hint: "只选正文主要介绍的目的地。留空时按标题识别；没有明确地点则归为全日本。"
      - label: "旅行主题（可选）"
        name: "topic"
        widget: "select"
        required: false
        options: ["行程路线", "交通接送", "住宿美食", "购物退税", "季节活动", "礼仪与生活"]
        hint: "只选这六个之一。路线、景点与城市攻略用「行程路线」；交通、包车和机场出入境用「交通接送」。留空时 a/c 为交通接送，d 为行程路线，b/e 为礼仪与生活。不改变永久网址。"
      - { label: "编辑精选（可选）", name: "featured", widget: "boolean", default: false, required: false, hint: "勾选后优先出现在旅行指南首页的编辑精选。最多展示 5 篇置顶。" }
      - { label: "精选排序（可选）", name: "featured_order", widget: "number", required: false, value_type: "int", min: 1, hint: "数字越小越靠前。1 是大卡片。留空则按发布日期，新的在前。" }
      - { label: "精选截止日期（可选）", name: "featured_until", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true, hint: "留空则一直置顶。到期当天仍显示，次日起不再优先，可被自动精选选中。" }
      - { label: "实际更新日期（可选）", name: "updated", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true, hint: "仅在实际更新文章内容时填写，不能早于发布日期。" }
      - { label: "封面替代文字", name: "cover_alt", widget: "string", required: false }
      - { label: "封面图注（地点、拍摄年份等）", name: "cover_caption", widget: "text", required: false }
      - { label: "摄影作者 / 署名", name: "cover_credit", widget: "string", required: false }
      - { label: "作者链接", name: "cover_creator_url", widget: "string", required: false }
      - { label: "图片来源页链接", name: "cover_source", widget: "string", required: false }
      - { label: "图片许可名称", name: "cover_license", widget: "string", required: false }
      - { label: "图片许可链接", name: "cover_license_url", widget: "string", required: false }
      - { label: "图片改动说明（缩小、裁切等）", name: "cover_changes", widget: "string", required: false }
      - label: "标题"
        name: "title_i18n"
        widget: "object"
        fields:
          - { label: "日文（可选）", name: "ja", widget: "string", required: false }
          - { label: "中文", name: "zh", widget: "string" }
          - { label: "英文（可选）", name: "en", widget: "string", required: false }
      - label: "摘要"
        name: "excerpt_i18n"
        widget: "object"
        fields:
          - { label: "日文（可选）", name: "ja", widget: "text", required: false }
          - { label: "中文", name: "zh", widget: "text" }
          - { label: "英文（可选）", name: "en", widget: "text", required: false }
      - { label: "正文（Markdown）", name: "body", widget: "markdown", hint: "列表请使用编辑器的列表按钮；每一项的加粗标题、冒号和说明写在同一项中，不要手动输入 * 号，也不要在冒号前换行。" }

# 文章列表和 sitemap 由构建脚本自动生成，无需手动维护索引。
publish_mode: simple
editor:
  preview: true
