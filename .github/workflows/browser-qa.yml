name: Browser release checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [ci/browser-release-checks]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install existing test and browser dependencies
        run: |
          python -m pip install -r requirements.txt playwright==1.56.0
          npm ci --prefix tests
          python -m playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Build and run regressions
        run: |
          python scripts/build.py
          python -m unittest discover -s tests -v
          npm test --prefix tests
      - name: Check desktop and mobile rendering
        run: python scripts/browser_qa.py --output "$RUNNER_TEMP/browser-results"
      - name: Retain exact-run browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results-${{ github.sha }}
          path: ${{ runner.temp }}/browser-results
          retention-days: 7
          if-no-files-found: warn
